<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="JustJava orbital motif">
  <defs>
    <linearGradient id="orb-g" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#255BEC"/>
      <stop offset="0.55" stop-color="#542CF6"/>
      <stop offset="1" stop-color="#780AFF"/>
    </linearGradient>
    <radialGradient id="orb-core" cx="300" cy="300" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ACAF9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#255BEC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="url(#orb-g)" stroke-width="1.25" fill="none" opacity="0.85">
    <ellipse cx="300" cy="300" rx="240" ry="240"/>
    <ellipse cx="300" cy="300" rx="240" ry="90" transform="rotate(0 300 300)"/>
    <ellipse cx="300" cy="300" rx="240" ry="90" transform="rotate(30 300 300)"/>
    <ellipse cx="300" cy="300" rx="240" ry="90" transform="rotate(60 300 300)"/>
    <ellipse cx="300" cy="300" rx="240" ry="90" transform="rotate(90 300 300)"/>
    <ellipse cx="300" cy="300" rx="240" ry="90" transform="rotate(120 300 300)"/>
    <ellipse cx="300" cy="300" rx="240" ry="90" transform="rotate(150 300 300)"/>
    <ellipse cx="300" cy="300" rx="180" ry="180"/>
    <ellipse cx="300" cy="300" rx="120" ry="120"/>
    <ellipse cx="300" cy="300" rx="60" ry="60"/>
  </g>
  <circle cx="300" cy="300" r="80" fill="url(#orb-core)"/>
  <circle cx="300" cy="60" r="4" fill="#5ACAF9"/>
  <circle cx="508" cy="180" r="3" fill="#780AFF"/>
  <circle cx="508" cy="420" r="3" fill="#255BEC"/>
  <circle cx="300" cy="540" r="4" fill="#5ACAF9"/>
  <circle cx="92" cy="420" r="3" fill="#780AFF"/>
  <circle cx="92" cy="180" r="3" fill="#255BEC"/>
</svg>
